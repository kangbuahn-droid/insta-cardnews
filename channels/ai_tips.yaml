# AI 팁 채널: 소스 없이 AI가 매일 팁 주제를 기획 → 카드뉴스 + 릴스
# 슬라이드마다 어울리는 그림을 AI 이미지 생성으로 만든다(.env 의 OPENAI_API_KEY 또는 GEMINI_API_KEY).
name: ai_tips
display_name: AI 꿀팁
enabled: true
template: tips
cover_label: 저장해두고 따라하기
handle: "@your_handle"

# 매일 기획 시간과 한 번에 만들 개수. 텔레그램 /collect 로 바로, /tip 주제 로 원하는 주제를 만들 수도 있어요.
collect_at: ["06:30"]
per_collect: 3

schedule: ["08:00", "12:30", "19:00"]
review: true
formats: [carousel, reels]

min_slides: 7
max_slides: 10

instagram:
  user_id_env: IG_USER_ID
  token_env: IG_ACCESS_TOKEN

# 주제 분야. 자유롭게 추가·삭제하세요.
topics:
  - "따라하기: 메뉴 경로와 순서까지 알려주는 단계별 사용법 (예: ChatGPT로 PDF 요약하기)"
  - "숨은 기능·설정: 모르는 사람이 많은 기능과 켜는 법 (메모리, 맞춤 지침, 프로젝트, 음성 모드 등)"
  - "도구 비교: 같은 일을 하는 AI 도구 2~4개를 무료 범위·장단점·추천 상황으로 비교"
  - "업무 워크플로: 회의록·보고서·엑셀·PPT·메일을 AI로 처리하는 실제 작업 순서"
  - "직무별 활용 사례: 마케터·개발자·디자이너·학생·자영업자가 실제로 쓰는 방법"
  - "흔한 실수와 해결법: 결과가 이상할 때 원인과 고치는 방법"
  - "이미지·영상 생성: 스타일·구도·조명 고르는 법과 실제 프롬프트"
  - "AI 결과 검증·보안: 틀린 답 걸러내기, 회사 자료 넣을 때 주의할 점"
  - "AI로 생활 꿀팁: 여행 계획, 가계부, 이력서·면접 준비, 공부 계획을 AI로 하는 구체적 방법"
  - "알아두면 좋은 AI 상식: 무료/유료 차이, 개인정보 설정, 쓰면 안 되는 상황 같은 실용 정보"

# AI 그림 기본 그림체(분위기 그림에만 적용, 이미지 생성 예시 그림에는 적용 안 함)
image_style: >
  Modern editorial 3D illustration, soft studio lighting, clean composition, vibrant but tasteful colors,
  subtle depth of field, high detail, Instagram-friendly

hashtags: ["#AI", "#AI활용", "#AI꿀팁", "#챗GPT", "#프롬프트", "#이미지생성", "#업무자동화", "#카드뉴스"]
cta: "나중에 따라하려면 저장, 매일 AI 꿀팁 받으려면 팔로우"

persona: |
  너는 바쁜 직장인·학생을 위한 인스타그램 'AI 꿀팁' 카드뉴스 에디터다.
  AI를 처음 써보는 사람도 바로 따라 할 수 있게 쉬운 말과 구체적인 예시로 쓰고, 부드러운 존댓말(~해요, ~해보세요)을 쓴다.
  목표는 "이건 저장해둬야겠다"는 반응이다. 막연한 조언 대신 복사해서 바로 쓰는 프롬프트와 단계를 준다.

pick_rules: |
  [주제 기획 기준]
  - 위 분야를 고르게 돌아가며 기획한다. 프롬프트 자체가 주제인 글은 하루에 최대 1개. 나머지는 기능·방법·정보·비교 중심.
  - 한 게시물 = 한 가지 목적(예: "회의 녹음 → 회의록 → 할 일 메일까지 10분 만에").
  - 제목에 결과·숫자·대상을 넣어 구체적으로(예: "엑셀 몰라도 되는 ChatGPT 데이터 분석 5단계").
  - outline 은 리서치 메모처럼 자세히 쓴다: 실제 단계와 순서, 어디를 누르는지, 어떤 설정을 켜는지, 입력 예시와 결과 예시,
    무료/유료 차이, 주의할 점, 시간이 얼마나 줄어드는지 같은 구체적 정보 10~15줄.
  - 너가 확실히 아는 널리 알려진 기능만 다룬다. 출시 직후라 불확실한 기능, 자주 바뀌는 가격은 주제로 삼지 않는다.

write_rules: |
  [목표] 읽는 사람이 이 게시물만 보고 바로 따라 할 수 있을 만큼 자세하고 실용적으로. 뻔한 조언("구체적으로 물어보세요")은 금지.
  1. 구성: 표지 → "이럴 때 쓰세요"(상황·얻는 것) 1장 → 본문 5~7장 → "한눈에 정리" 체크리스트 1장 → 마무리. type=reaction 은 쓰지 않는다.
  2. 본문 장은 주제 성격에 맞게:
     - 따라하기: 1단계·2단계… 각 장에 무엇을 누르고 무엇을 입력하는지, 그 결과 무엇이 나오는지.
     - 비교: 도구마다 한 장씩 "잘하는 것 / 무료 범위 / 추천 상황".
     - 실수와 해결: "이런 증상 → 원인 → 이렇게 고치기".
     - 워크플로·사례: 실제 상황 예시(누가, 어떤 자료로, 결과물이 무엇인지)를 넣는다.
  3. 본문 장의 body 는 3~5줄, 180자 이내. 줄바꿈(\n)으로 나누고 필요하면 "• " 글머리표나 "① ②" 번호를 쓴다.
     숫자·메뉴 이름·버튼 이름처럼 구체적인 정보를 최소 하나는 넣는다.
  4. 이 채널은 프롬프트 모음이 아니라 "방법과 정보"를 주는 채널이다. 내용의 중심은 기능·설정·순서·비교·주의점이다.
     prompt 는 프롬프트가 꼭 필요한 장에만, 한 게시물에 최대 1장(프롬프트가 주제인 글만 최대 3장). 나머지 장은 prompt="".
     prompt 를 넣는 장은 body 를 120자 이내로 줄인다.
  5. "한눈에 정리" 장: title="한눈에 정리", body = 핵심 행동 4~6개를 "✓ " 로 시작하는 줄로.
  6. 이미지 생성 팁이면 prompt 는 실제로 쓸 영어 프롬프트(40단어 이내), image_mode="example", image=그 prompt 와 같은 내용.
  7. 그 외에는 표지와 본문 1장만 image_mode="illustration", image=그 장의 느낌을 주는 장면을 영어 한 문장으로 묘사
     (글자·로고·실존 인물은 그리지 않게). 그림을 넣는 장은 body 를 120자 이내로. 나머지 장은 image_mode="none".
  8. 확실하지 않은 메뉴 이름·요금·버전은 쓰지 말고 "설정에서 ○○ 항목"처럼 일반적으로 쓴다. 기능은 널리 알려진 것만.
  9. caption 은 "이런 분께 추천" 한 줄 + 게시물 핵심 요약 3~4문장(카드에 없는 보충 팁 1개 포함) + "저장해두고 하나씩 따라 해보세요".
  10. keyword 는 주제를 나타내는 영어 대문자 단어(예: WORKFLOW, EXCEL, CLAUDE, COMPARE).
